<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>من هر شب - میثم ابراهیمی</title>

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #171717, #3b1f2b);
            font-family: Tahoma, Arial, sans-serif;
            color: white;
        }

        .card {
            width: 90%;
            max-width: 420px;
            padding: 35px 25px;
            text-align: center;
            background: rgba(255,255,255,0.08);
            border-radius: 25px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.4);
            backdrop-filter: blur(10px);
        }

        .music-icon {
            font-size: 70px;
            margin-bottom: 15px;
        }

        h1 {
            margin: 10px 0;
            font-size: 28px;
        }

        h2 {
            margin: 0 0 25px;
            font-size: 18px;
            font-weight: normal;
            opacity: 0.8;
        }

        audio {
            width: 100%;
            margin-top: 20px;
        }

        .text {
            margin-top: 25px;
            font-size: 14px;
            opacity: 0.7;
            line-height: 2;
        }
    </style>
</head>

<body>

    <div class="card">

        <div class="music-icon">🎵</div>

        <h1>من هر شب</h1>

        <h2>میثم ابراهیمی</h2>

        <audio controls>
            <source src="https://dl.rozmusic.com/Music/1404/02/27/Meysam%20Ebrahimi%20-%20Man%20Har%20Shab.mp3" type="audio/mpeg">
            مرورگر شما از پخش فایل صوتی پشتیبانی نمی‌کند.
        </audio>

        <div class="text">
            برای پخش آهنگ، دکمه ▶️ را فشار دهید.
        </div>

    </div>

</body>
</html>
