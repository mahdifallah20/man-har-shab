<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>من هر شب | میثم ابراهیمی</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: Tahoma, Arial, sans-serif;
    color: white;

    display: flex;
    justify-content: center;
    align-items: center;

    background-image:
        linear-gradient(
            rgba(0,0,0,0.48),
            rgba(0,0,0,0.62)
        ),
        url("music-page-background.jpg");

    background-size: cover;
    background-position: center;
    background-attachment: fixed;

    padding: 25px;
}

.card {
    width: 100%;
    max-width: 440px;

    padding: 32px 25px;

    text-align: center;

    background: rgba(20,20,20,0.48);

    border: 1px solid rgba(255,255,255,0.25);

    border-radius: 30px;

    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);

    box-shadow:
        0 25px 70px rgba(0,0,0,0.55);
}

.disc {
    width: 190px;
    height: 190px;

    margin: 0 auto 25px;

    border-radius: 50%;

    background:
        radial-gradient(
            circle,
            #111 0 9%,
            #eee 10% 13%,
            #222 14% 22%,
            #111 23% 100%
        );

    border: 5px solid rgba(255,255,255,0.25);

    box-shadow:
        0 15px 45px rgba(0,0,0,0.7);

    display: flex;
    align-items: center;
    justify-content: center;

    animation: rotate 10s linear infinite;
    animation-play-state: paused;
}

.disc.playing {
    animation-play-state: running;
}

.center {
    width: 48px;
    height: 48px;

    border-radius: 50%;

    background: #d8a85b;

    border: 6px solid #222;

    box-shadow: 0 0 20px rgba(255,255,255,0.4);
}

@keyframes rotate {
    from {
        transform: rotate(0deg);
    }

    to {
        transform: rotate(360deg);
    }
}

.label {
    font-size: 14px;
    opacity: 0.75;
    margin-bottom: 8px;
}

h1 {
    margin: 0;

    font-size: 32px;

    text-shadow:
        0 3px 15px rgba(0,0,0,0.7);
}

.artist {
    margin-top: 10px;

    font-size: 18px;

    opacity: 0.85;
}

.line {
    width: 70px;
    height: 3px;

    margin: 22px auto;

    border-radius: 10px;

    background: rgba(255,255,255,0.8);
}

.equalizer {
    height: 35px;

    display: flex;

    justify-content: center;
    align-items: center;

    gap: 5px;

    margin-bottom: 15px;
}

.equalizer span {
    width: 4px;
    height: 8px;

    border-radius: 5px;

    background: white;

    animation:
        equalizer 0.7s ease-in-out infinite alternate;

    animation-play-state: paused;
}

.equalizer.playing span {
    animation-play-state: running;
}

.equalizer span:nth-child(2) {
    animation-delay: .1s;
}

.equalizer span:nth-child(3) {
    animation-delay: .2s;
}

.equalizer span:nth-child(4) {
    animation-delay: .3s;
}

.equalizer span:nth-child(5) {
    animation-delay: .2s;
}

.equalizer span:nth-child(6) {
    animation-delay: .1s;
}

@keyframes equalizer {
    from {
        height: 7px;
    }

    to {
        height: 32px;
    }
}

audio {
    width: 100%;
}

.message {
    margin-top: 22px;

    font-size: 13px;

    line-height: 2;

    opacity: 0.7;
}

.footer {
    margin-top: 25px;

    font-size: 12px;

    opacity: 0.5;
}

</style>
</head>

<body>

<div class="card">

    <div class="disc" id="disc">
        <div class="center"></div>
    </div>

    <div class="label">
        🎵 آهنگ
    </div>

    <h1>
        من هر شب
    </h1>

    <div class="artist">
        میثم ابراهیمی
    </div>

    <div class="line"></div>

    <div class="equalizer" id="equalizer">
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
    </div>

    <audio id="player" controls>
        <source
            src="https://dl.rozmusic.com/Music/1404/02/27/Meysam%20Ebrahimi%20-%20Man%20Har%20Shab.mp3"
            type="audio/mpeg">
    </audio>

    <div class="message">
        برای شنیدن آهنگ، دکمه ▶️ را فشار دهید.
    </div>

    <div class="footer">
        🎶 با عشق برای یک خاطره زیبا
    </div>

</div>

<script>

const player = document.getElementById("player");
const disc = document.getElementById("disc");
const equalizer = document.getElementById("equalizer");

player.addEventListener("play", function() {
    disc.classList.add("playing");
    equalizer.classList.add("playing");
});

player.addEventListener("pause", function() {
    disc.classList.remove("playing");
    equalizer.classList.remove("playing");
});

player.addEventListener("ended", function() {
    disc.classList.remove("playing");
    equalizer.classList.remove("playing");
});

</script>

</body>
</html>
