<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>من هر شب | میثم ابراهیمی</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
}

body {

    background: #111;

    overflow: hidden;

    font-family:
        Tahoma,
        Arial,
        sans-serif;

    display: flex;

    justify-content: center;

    align-items: center;
}


/* ==================================================
   محدوده واقعی عکس

   نسبت عکس اصلی:
   853 × 1280
================================================== */

.photo-stage {

    position: relative;

    width: min(
        100vw,
        calc(100dvh * 853 / 1280)
    );

    height: min(
        100dvh,
        calc(100vw * 1280 / 853)
    );

    flex-shrink: 0;

    overflow: hidden;
}


/* ==================================================
   عکس اصلی

   بدون فیلتر
   بدون Blur
   بدون تغییر چهره
   بدون تغییر رنگ
================================================== */

.photo-stage > img {

    position: absolute;

    inset: 0;

    width: 100%;

    height: 100%;

    display: block;

    object-fit: fill;

    filter: none;

    opacity: 1;
}


/* ==================================================
   کادر موزیک

   جای آن نسبت به خود عکس تعیین شده
================================================== */

.music-card {

    position: absolute;

    z-index: 5;

    top: 18px;

    left: 18px;

    width: 245px;

    padding: 14px 13px;

    border-radius: 18px;

    text-align: center;

    background: rgba(0, 0, 0, 0.25);

    border:
        1px solid
        rgba(255, 255, 255, 0.60);

    box-shadow:
        0 6px 20px
        rgba(0, 0, 0, 0.25);

    /*
       عمداً Blur خاموش است.
       بنابراین عکس و چهره زیر کادر
       تار نمی‌شوند.
    */

    backdrop-filter: none;

    -webkit-backdrop-filter: none;
}


/* ==================================================
   دیسک
================================================== */

.disc {

    width: 76px;

    height: 76px;

    margin:
        0 auto 8px;

    border-radius: 50%;

    background:

        radial-gradient(
            circle,
            #d7a63d 0 7%,
            #292929 8% 13%,
            #111 14% 100%
        );

    border:
        3px solid
        rgba(255,255,255,0.30);

    box-shadow:
        0 5px 14px
        rgba(0,0,0,0.45);

    animation:
        spin 8s linear infinite;

    animation-play-state: paused;
}


.disc.playing {

    animation-play-state: running;
}


@keyframes spin {

    from {
        transform: rotate(0deg);
    }

    to {
        transform: rotate(360deg);
    }

}


/* ==================================================
   متن آهنگ
================================================== */

.label {

    font-size: 10px;

    color: #fff;

    margin-bottom: 3px;

    text-shadow:
        0 2px 5px
        rgba(0,0,0,0.9);
}


.title {

    margin: 0;

    color: white;

    font-size: 21px;

    font-weight: bold;

    text-shadow:
        0 2px 7px
        rgba(0,0,0,1);
}


.artist {

    margin-top: 4px;

    color: white;

    font-size: 12px;

    text-shadow:
        0 2px 5px
        rgba(0,0,0,0.9);
}


/* ==================================================
   خط تزئینی
================================================== */

.line {

    width: 42px;

    height: 2px;

    margin:
        9px auto;

    background: white;

    border-radius: 5px;
}


/* ==================================================
   اکولایزر
================================================== */

.equalizer {

    height: 18px;

    display: flex;

    justify-content: center;

    align-items: center;

    gap: 3px;

    margin-bottom: 6px;
}


.equalizer span {

    width: 3px;

    height: 5px;

    border-radius: 4px;

    background: white;

    animation:
        bars .6s ease-in-out
        infinite alternate;

    animation-play-state: paused;
}


.equalizer.playing span {

    animation-play-state: running;
}


.equalizer span:nth-child(2) {
    animation-delay: .1s;
}

.equalizer span:nth-child(3) {
    animation-delay: .2s;
}

.equalizer span:nth-child(4) {
    animation-delay: .3s;
}

.equalizer span:nth-child(5) {
    animation-delay: .2s;
}

.equalizer span:nth-child(6) {
    animation-delay: .1s;
}


@keyframes bars {

    from {
        height: 5px;
    }

    to {
        height: 17px;
    }

}


/* ==================================================
   پلیر
================================================== */

audio {

    display: block;

    width: 100%;

    height: 40px;

    margin: 0;
}


/* ==================================================
   متن پایین
================================================== */

.help {

    margin-top: 7px;

    color: white;

    font-size: 9px;

    line-height: 1.7;

    text-shadow:
        0 2px 5px
        rgba(0,0,0,1);
}


/* ==================================================
   موبایل
================================================== */

@media (max-width: 600px) {

    .music-card {

        top: 12px;

        left: 12px;

        width: 190px;

        padding: 10px 9px;

        border-radius: 15px;
    }


    .disc {

        width: 58px;

        height: 58px;

        margin-bottom: 6px;
    }


    .label {

        font-size: 8px;
    }


    .title {

        font-size: 17px;
    }


    .artist {

        font-size: 10px;

        margin-top: 3px;
    }


    .line {

        width: 32px;

        margin:
            6px auto;
    }


    .equalizer {

        height: 15px;

        margin-bottom: 4px;
    }


    .equalizer span {

        width: 2px;

        height: 4px;
    }


    audio {

        height: 36px;
    }


    .help {

        font-size: 7px;

        margin-top: 4px;
    }

}


/* ==================================================
   گوشی‌های خیلی کوچک
================================================== */

@media (max-width: 380px) {

    .music-card {

        width: 175px;

        top: 10px;

        left: 10px;

        padding: 9px 8px;
    }


    .disc {

        width: 52px;

        height: 52px;
    }


    .title {

        font-size: 15px;
    }


    .artist {

        font-size: 9px;
    }


    audio {

        height: 34px;
    }

}

</style>

</head>


<body>


<!-- ==================================================
     این بخش دقیقاً اندازه خود عکس است
================================================== -->

<div class="photo-stage">


    <!--
       عکس اصلی شما

       این فایل نباید تغییر کند.
    -->

    <img
        src="music-page-background.jpg"
        alt="تصویر اصلی">


    <!-- ==================================================
         کادر موزیک
         داخل محدوده عکس
         گوشه بالا سمت چپ
    ================================================== -->

    <div class="music-card">


        <!-- دیسک -->

        <div
            class="disc"
            id="disc">
        </div>


        <!-- برچسب -->

        <div class="label">

            🎵 آهنگ

        </div>


        <!-- نام آهنگ -->

        <h1 class="title">

            من هر شب

        </h1>


        <!-- خواننده -->

        <div class="artist">

            میثم ابراهیمی

        </div>


        <!-- خط -->

        <div class="line"></div>


        <!-- اکولایزر -->

        <div
            class="equalizer"
            id="equalizer">

            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>

        </div>


        <!-- ==================================================
             فایل آهنگ
        ================================================== -->

        <audio
            id="player"
            controls>

            <source
                src="https://dl.rozmusic.com/Music/1404/02/27/Meysam%20Ebrahimi%20-%20Man%20Har%20Shab.mp3"
                type="audio/mpeg">

            مرورگر شما از پخش موسیقی پشتیبانی نمی‌کند.

        </audio>


        <!-- راهنما -->

        <div class="help">

            برای شنیدن آهنگ،
            دکمه ▶️ را فشار دهید.

        </div>


    </div>

</div>


<script>

/* ==================================================
   کنترل دیسک و اکولایزر
================================================== */

const player =
    document.getElementById("player");

const disc =
    document.getElementById("disc");

const equalizer =
    document.getElementById("equalizer");


player.addEventListener(
    "play",
    () => {

        disc.classList.add("playing");

        equalizer.classList.add("playing");

    }
);


player.addEventListener(
    "pause",
    () => {

        disc.classList.remove("playing");

        equalizer.classList.remove("playing");

    }
);


player.addEventListener(
    "ended",
    () => {

        disc.classList.remove("playing");

        equalizer.classList.remove("playing");

    }
);

</script>


</body>

</html>
