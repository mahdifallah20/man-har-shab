<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>من هر شب | میثم ابراهیمی</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    min-height: 100%;
}

body {

    min-height: 100vh;

    background: #111;

    font-family: Tahoma, Arial, sans-serif;

    color: white;

    display: flex;

    justify-content: center;

    align-items: center;

    padding: 20px;

    overflow: hidden;
}


/* عکس واقعی و اصلی */

.photo {

    position: fixed;

    inset: 0;

    width: 100%;
    height: 100%;

    object-fit: contain;

    object-position: center;

    z-index: 1;
}


/* لایه بسیار ملایم روی عکس */

.overlay {

    position: fixed;

    inset: 0;

    background:
        rgba(0,0,0,0.12);

    z-index: 2;

    pointer-events: none;
}


/* پنل موسیقی */

.card {

    position: relative;

    z-index: 10;

    width: min(410px, 92vw);

    padding: 25px 22px;

    text-align: center;

    background:
        rgba(15,15,15,0.38);

    border:
        1px solid
        rgba(255,255,255,0.30);

    border-radius: 28px;

    backdrop-filter:
        blur(5px);

    -webkit-backdrop-filter:
        blur(5px);

    box-shadow:
        0 20px 60px
        rgba(0,0,0,0.45);
}


/* دیسک */

.disc {

    width: 135px;

    height: 135px;

    margin: 0 auto 18px;

    border-radius: 50%;

    background:
        radial-gradient(
            circle,
            #d4a54c 0 8%,
            #222 9% 14%,
            #111 15% 100%
        );

    border:
        4px solid
        rgba(255,255,255,0.25);

    box-shadow:
        0 12px 35px
        rgba(0,0,0,0.65);

    animation:
        rotate 9s linear infinite;

    animation-play-state: paused;
}

.disc.playing {
    animation-play-state: running;
}

@keyframes rotate {

    from {
        transform: rotate(0deg);
    }

    to {
        transform: rotate(360deg);
    }

}


/* متن */

.label {

    font-size: 13px;

    opacity: .8;

    margin-bottom: 6px;
}

h1 {

    margin: 0;

    font-size: 30px;

    text-shadow:
        0 3px 12px
        rgba(0,0,0,.8);
}

.artist {

    margin-top: 8px;

    font-size: 17px;

    opacity: .9;
}


/* خط */

.line {

    width: 60px;

    height: 3px;

    margin: 17px auto;

    background:
        white;

    border-radius: 10px;

    opacity: .8;
}


/* اکولایزر */

.equalizer {

    height: 32px;

    display: flex;

    justify-content: center;

    align-items: center;

    gap: 5px;

    margin-bottom: 10px;
}

.equalizer span {

    width: 4px;

    height: 7px;

    background: white;

    border-radius: 5px;

    animation:
        bars .65s
        ease-in-out
        infinite
        alternate;

    animation-play-state:
        paused;
}

.equalizer.playing span {
    animation-play-state: running;
}

.equalizer span:nth-child(2) {
    animation-delay: .1s;
}

.equalizer span:nth-child(3) {
    animation-delay: .2s;
}

.equalizer span:nth-child(4) {
    animation-delay: .3s;
}

.equalizer span:nth-child(5) {
    animation-delay: .2s;
}

.equalizer span:nth-child(6) {
    animation-delay: .1s;
}

@keyframes bars {

    from {
        height: 7px;
    }

    to {
        height: 29px;
    }

}


/* پلیر */

audio {

    width: 100%;

    height: 48px;
}


/* توضیح */

.message {

    margin-top: 14px;

    font-size: 12px;

    line-height: 2;

    opacity: .8;
}


/* موبایل */

@media (max-width: 600px) {

    body {

        padding: 12px;

    }

    .card {

        width: 94vw;

        padding: 20px 17px;

    }

    .disc {

        width: 110px;

        height: 110px;

    }

    h1 {

        font-size: 26px;

    }

}


/* صفحه موبایل عمودی */

@media
(max-width:600px)
and (orientation:portrait) {

    .photo {

        width: 100%;

        height: 100%;

        object-fit: contain;

    }

}

</style>

</head>


<body>


<!--
    این همان فایل عکس اصلی شماست.
    هیچ فیلتر، برش یا تغییر نسبت تصویری روی آن اعمال نمی‌شود.
-->

<img
    class="photo"
    src="music-page-background.jpg"
    alt="تصویر پس زمینه">


<div class="overlay"></div>


<!-- پنل موسیقی -->

<div class="card">

    <div
        class="disc"
        id="disc">
    </div>


    <div class="label">
        🎵 آهنگ
    </div>


    <h1>
        من هر شب
    </h1>


    <div class="artist">
        میثم ابراهیمی
    </div>


    <div class="line"></div>


    <div
        class="equalizer"
        id="equalizer">

        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>

    </div>


    <audio
        id="player"
        controls>

        <source
            src="https://dl.rozmusic.com/Music/1404/02/27/Meysam%20Ebrahimi%20-%20Man%20Har%20Shab.mp3"
            type="audio/mpeg">

    </audio>


    <div class="message">

        برای شنیدن آهنگ،
        دکمه ▶️ را فشار دهید.

    </div>

</div>


<script>

const player =
    document.getElementById("player");

const disc =
    document.getElementById("disc");

const equalizer =
    document.getElementById("equalizer");


player.addEventListener(
    "play",
    () => {

        disc.classList.add("playing");

        equalizer.classList.add("playing");

    }
);


player.addEventListener(
    "pause",
    () => {

        disc.classList.remove("playing");

        equalizer.classList.remove("playing");

    }
);


player.addEventListener(
    "ended",
    () => {

        disc.classList.remove("playing");

        equalizer.classList.remove("playing");

    }
);

</script>


</body>
</html>
