<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>من هر شب | میثم ابراهیمی</title>


<style>

/* =========================
   تنظیمات اصلی
========================= */

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
}


body {

    width: 100%;
    min-height: 100vh;

    background: #111;

    color: white;

    font-family:
        Tahoma,
        Arial,
        sans-serif;

    overflow: hidden;
}


/* =========================
   عکس اصلی
========================= */

.photo {

    position: fixed;

    top: 0;
    left: 0;

    width: 100vw;
    height: 100vh;

    /*
       مهم:
       عکس اصلاً بریده یا زوم نمی‌شود.
    */

    object-fit: contain;

    object-position: center center;

    /*
       هیچ فیلتر یا تاری وجود ندارد.
    */

    filter: none;

    opacity: 1;

    z-index: 1;
}


/* =========================
   لایه روی عکس
   کاملاً شفاف
========================= */

.overlay {

    position: fixed;

    top: 0;
    left: 0;

    width: 100%;
    height: 100%;

    background: transparent;

    pointer-events: none;

    z-index: 2;
}


/* =========================
   کادر موزیک
========================= */

.card {

    position: fixed;

    /*
       گوشه بالا سمت چپ
    */

    top: 25px;
    left: 25px;

    z-index: 10;

    width: 350px;

    max-width: calc(100vw - 50px);

    padding: 22px 20px;

    text-align: center;

    /*
       فقط کمی شفافیت برای زیبایی.
       هیچ Blur وجود ندارد.
    */

    background:
        rgba(0, 0, 0, 0.12);

    border:
        1px solid
        rgba(255, 255, 255, 0.55);

    border-radius: 24px;

    /*
       بسیار مهم:
       تصویر پشت کادر تار نمی‌شود.
    */

    backdrop-filter: none;

    -webkit-backdrop-filter: none;

    box-shadow:
        0 12px 35px
        rgba(0, 0, 0, 0.25);
}


/* =========================
   دیسک موسیقی
========================= */

.disc {

    width: 125px;
    height: 125px;

    margin:
        0 auto 16px;

    border-radius: 50%;

    background:

        radial-gradient(
            circle,
            #d6a541 0 7%,
            #222 8% 13%,
            #111 14% 100%
        );

    border:
        4px solid
        rgba(255,255,255,0.28);

    box-shadow:
        0 8px 25px
        rgba(0,0,0,0.45);

    animation:
        rotateDisc 9s linear infinite;

    animation-play-state: paused;
}


/* چرخش دیسک هنگام پخش */

.disc.playing {

    animation-play-state: running;
}


@keyframes rotateDisc {

    from {
        transform: rotate(0deg);
    }

    to {
        transform: rotate(360deg);
    }

}


/* =========================
   متن بالای عنوان
========================= */

.label {

    font-size: 13px;

    margin-bottom: 5px;

    color: white;

    text-shadow:
        0 2px 7px
        rgba(0,0,0,0.8);
}


/* =========================
   عنوان آهنگ
========================= */

h1 {

    margin: 0;

    font-size: 28px;

    font-weight: bold;

    color: white;

    text-shadow:
        0 3px 10px
        rgba(0,0,0,0.9);
}


/* =========================
   نام خواننده
========================= */

.artist {

    margin-top: 7px;

    font-size: 16px;

    color: white;

    text-shadow:
        0 2px 8px
        rgba(0,0,0,0.9);
}


/* =========================
   خط تزئینی
========================= */

.line {

    width: 60px;

    height: 3px;

    margin:
        15px auto;

    background: white;

    border-radius: 10px;

    box-shadow:
        0 2px 8px
        rgba(0,0,0,0.6);
}


/* =========================
   اکولایزر
========================= */

.equalizer {

    height: 30px;

    display: flex;

    justify-content: center;

    align-items: center;

    gap: 5px;

    margin-bottom: 10px;
}


.equalizer span {

    width: 4px;

    height: 7px;

    background: white;

    border-radius: 5px;

    animation:
        equalizerBars
        0.65s
        ease-in-out
        infinite
        alternate;

    animation-play-state: paused;
}


.equalizer.playing span {

    animation-play-state: running;
}


.equalizer span:nth-child(2) {
    animation-delay: 0.1s;
}

.equalizer span:nth-child(3) {
    animation-delay: 0.2s;
}

.equalizer span:nth-child(4) {
    animation-delay: 0.3s;
}

.equalizer span:nth-child(5) {
    animation-delay: 0.2s;
}

.equalizer span:nth-child(6) {
    animation-delay: 0.1s;
}


@keyframes equalizerBars {

    from {
        height: 7px;
    }

    to {
        height: 28px;
    }

}


/* =========================
   پلیر موسیقی
========================= */

audio {

    display: block;

    width: 100%;

    height: 48px;

    margin: 0 auto;
}


/* =========================
   متن پایین
========================= */

.message {

    margin-top: 12px;

    font-size: 12px;

    line-height: 1.9;

    color: white;

    text-shadow:
        0 2px 7px
        rgba(0,0,0,0.9);
}


/* =========================
   نمایشگرهای کوچک
========================= */

@media (max-width: 600px) {

    .card {

        top: 15px;

        left: 15px;

        width: 310px;

        max-width:
            calc(100vw - 30px);

        padding:
            18px 15px;

        border-radius: 20px;
    }


    .disc {

        width: 105px;

        height: 105px;
    }


    h1 {

        font-size: 24px;
    }


    .artist {

        font-size: 15px;
    }

}


/* =========================
   موبایل عمودی
========================= */

@media
(max-width: 600px)
and (orientation: portrait) {

    .photo {

        width: 100vw;

        height: 100vh;

        object-fit: contain;

        object-position: center center;
    }

}

</style>

</head>


<body>


<!-- ==================================================
     عکس اصلی
     
     نام فایل باید دقیقاً همین باشد:
     music-page-background.jpg
================================================== -->

<img
    class="photo"
    src="music-page-background.jpg"
    alt="تصویر پس زمینه">


<!-- لایه کاملاً شفاف -->

<div class="overlay"></div>


<!-- ==================================================
     کادر موزیک
================================================== -->

<div class="card">


    <!-- دیسک -->

    <div
        class="disc"
        id="disc">
    </div>


    <!-- عنوان کوچک -->

    <div class="label">

        🎵 آهنگ

    </div>


    <!-- نام آهنگ -->

    <h1>

        من هر شب

    </h1>


    <!-- نام خواننده -->

    <div class="artist">

        میثم ابراهیمی

    </div>


    <!-- خط تزئینی -->

    <div class="line"></div>


    <!-- اکولایزر -->

    <div
        class="equalizer"
        id="equalizer">

        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>

    </div>


    <!-- ==================================================
         پخش کننده آهنگ
    ================================================== -->

    <audio
        id="player"
        controls>

        <source
            src="https://dl.rozmusic.com/Music/1404/02/27/Meysam%20Ebrahimi%20-%20Man%20Har%20Shab.mp3"
            type="audio/mpeg">

        مرورگر شما از پخش موسیقی پشتیبانی نمی‌کند.

    </audio>


    <!-- متن پایین -->

    <div class="message">

        برای شنیدن آهنگ،
        دکمه ▶️ را فشار دهید.

    </div>


</div>


<!-- ==================================================
     کنترل انیمیشن‌ها
================================================== -->

<script>


const player =
    document.getElementById("player");


const disc =
    document.getElementById("disc");


const equalizer =
    document.getElementById("equalizer");


/* هنگام شروع آهنگ */

player.addEventListener(
    "play",
    function() {

        disc.classList.add("playing");

        equalizer.classList.add("playing");

    }
);


/* هنگام توقف آهنگ */

player.addEventListener(
    "pause",
    function() {

        disc.classList.remove("playing");

        equalizer.classList.remove("playing");

    }
);


/* هنگام پایان آهنگ */

player.addEventListener(
    "ended",
    function() {

        disc.classList.remove("playing");

        equalizer.classList.remove("playing");

    }
);


</script>


</body>

</html>
