<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>من هر شب | میثم ابراهیمی</title>


<style>

/* =====================================
   تنظیمات اصلی
===================================== */

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
}

body {

    background: #111;

    font-family:
        Tahoma,
        Arial,
        sans-serif;

    overflow: hidden;

    display: flex;

    justify-content: center;

    align-items: center;
}


/* =====================================
   محدوده واقعی عکس
   نسبت عکس اصلی:
   853 × 1280
===================================== */

.photo-wrap {

    position: relative;

    height: min(100vh, 150.06vw);

    aspect-ratio: 853 / 1280;

    flex-shrink: 0;

}


/* =====================================
   خود عکس اصلی

   هیچ تغییر، فیلتر یا تاری ندارد
===================================== */

.photo {

    position: absolute;

    inset: 0;

    width: 100%;

    height: 100%;

    object-fit: contain;

    object-position: center;

    filter: none;

    opacity: 1;

    display: block;
}


/* =====================================
   هیچ لایه‌ای روی عکس وجود ندارد
===================================== */

.overlay {

    display: none;
}


/* =====================================
   کادر کوچک موزیک

   داخل خود عکس
   گوشه بالا سمت چپ
===================================== */

.card {

    position: absolute;

    z-index: 10;

    top: 18px;

    left: 18px;

    width: 285px;

    max-width: calc(100% - 36px);

    padding: 17px 15px;

    text-align: center;

    /*
       کاملاً کمی شفاف
       بدون Blur
    */

    background:
        rgba(0, 0, 0, 0.30);

    border:
        1px solid
        rgba(255, 255, 255, 0.55);

    border-radius: 20px;

    /*
       مهم:
       هیچ تاری روی چهره یا عکس ایجاد نمی‌شود.
    */

    backdrop-filter: none;

    -webkit-backdrop-filter: none;

    box-shadow:
        0 8px 25px
        rgba(0, 0, 0, 0.30);
}


/* =====================================
   دیسک
===================================== */

.disc {

    width: 88px;

    height: 88px;

    margin:
        0 auto 10px;

    border-radius: 50%;

    background:

        radial-gradient(
            circle,
            #d6a541 0 7%,
            #222 8% 13%,
            #111 14% 100%
        );

    border:
        3px solid
        rgba(255,255,255,0.30);

    box-shadow:
        0 7px 18px
        rgba(0,0,0,0.45);

    animation:
        rotateDisc
        9s linear infinite;

    animation-play-state: paused;
}


.disc.playing {

    animation-play-state: running;
}


@keyframes rotateDisc {

    from {
        transform: rotate(0deg);
    }

    to {
        transform: rotate(360deg);
    }

}


/* =====================================
   متن کوچک
===================================== */

.label {

    font-size: 11px;

    margin-bottom: 3px;

    color: white;

    text-shadow:
        0 2px 6px
        rgba(0,0,0,0.9);
}


/* =====================================
   نام آهنگ
===================================== */

h1 {

    margin: 0;

    font-size: 23px;

    font-weight: bold;

    color: white;

    text-shadow:
        0 2px 8px
        rgba(0,0,0,0.95);
}


/* =====================================
   نام خواننده
===================================== */

.artist {

    margin-top: 5px;

    font-size: 13px;

    color: white;

    text-shadow:
        0 2px 6px
        rgba(0,0,0,0.9);
}


/* =====================================
   خط
===================================== */

.line {

    width: 45px;

    height: 2px;

    margin:
        10px auto;

    background: white;

    border-radius: 10px;
}


/* =====================================
   اکولایزر
===================================== */

.equalizer {

    height: 22px;

    display: flex;

    justify-content: center;

    align-items: center;

    gap: 4px;

    margin-bottom: 7px;
}


.equalizer span {

    width: 3px;

    height: 6px;

    background: white;

    border-radius: 5px;

    animation:
        equalizerBars
        0.65s
        ease-in-out
        infinite
        alternate;

    animation-play-state: paused;
}


.equalizer.playing span {

    animation-play-state: running;
}


.equalizer span:nth-child(2) {
    animation-delay: .1s;
}

.equalizer span:nth-child(3) {
    animation-delay: .2s;
}

.equalizer span:nth-child(4) {
    animation-delay: .3s;
}

.equalizer span:nth-child(5) {
    animation-delay: .2s;
}

.equalizer span:nth-child(6) {
    animation-delay: .1s;
}


@keyframes equalizerBars {

    from {
        height: 6px;
    }

    to {
        height: 20px;
    }

}


/* =====================================
   پخش کننده
===================================== */

audio {

    display: block;

    width: 100%;

    height: 42px;

    margin: 0 auto;
}


/* =====================================
   متن پایین
===================================== */

.message {

    margin-top: 8px;

    font-size: 10px;

    line-height: 1.8;

    color: white;

    text-shadow:
        0 2px 6px
        rgba(0,0,0,0.95);
}


/* =====================================
   موبایل
===================================== */

@media (max-width: 600px) {

    .card {

        top: 10px;

        left: 10px;

        width: 235px;

        max-width:
            calc(100% - 20px);

        padding:
            13px 11px;

        border-radius: 17px;
    }


    .disc {

        width: 70px;

        height: 70px;

        margin-bottom: 7px;
    }


    h1 {

        font-size: 19px;
    }


    .artist {

        font-size: 11px;
    }


    .label {

        font-size: 9px;
    }


    .line {

        margin: 7px auto;

        width: 35px;
    }


    .equalizer {

        height: 17px;

        margin-bottom: 4px;
    }


    .message {

        font-size: 8px;

        margin-top: 5px;
    }


    audio {

        height: 38px;
    }

}


/* =====================================
   موبایل خیلی کوچک
===================================== */

@media (max-width: 380px) {

    .card {

        width: 205px;

        padding:
            11px 9px;
    }


    .disc {

        width: 60px;

        height: 60px;
    }


    h1 {

        font-size: 17px;
    }


    .artist {

        font-size: 10px;
    }

}

</style>

</head>


<body>


<!-- =====================================
     محدوده خود عکس
===================================== -->

<div class="photo-wrap">


    <!--
        این همان عکس اصلی شماست.
        هیچ تغییری روی آن اعمال نمی‌شود.
    -->

    <img
        class="photo"
        src="music-page-background.jpg"
        alt="تصویر">


    <!-- =================================
         کادر آهنگ
         داخل خود عکس
    ================================== -->

    <div class="card">


        <!-- دیسک -->

        <div
            class="disc"
            id="disc">
        </div>


        <!-- عنوان کوچک -->

        <div class="label">

            🎵 آهنگ

        </div>


        <!-- نام آهنگ -->

        <h1>

            من هر شب

        </h1>


        <!-- خواننده -->

        <div class="artist">

            میثم ابراهیمی

        </div>


        <!-- خط -->

        <div class="line"></div>


        <!-- اکولایزر -->

        <div
            class="equalizer"
            id="equalizer">

            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>

        </div>


        <!-- پخش کننده -->

        <audio
            id="player"
            controls>

            <source
                src="https://dl.rozmusic.com/Music/1404/02/27/Meysam%20Ebrahimi%20-%20Man%20Har%20Shab.mp3"
                type="audio/mpeg">

            مرورگر شما از پخش موسیقی پشتیبانی نمی‌کند.

        </audio>


        <!-- توضیح -->

        <div class="message">

            برای شنیدن آهنگ،
            دکمه ▶️ را فشار دهید.

        </div>


    </div>

</div>


<!-- =====================================
     کنترل انیمیشن‌ها
===================================== -->

<script>

const player =
    document.getElementById("player");

const disc =
    document.getElementById("disc");

const equalizer =
    document.getElementById("equalizer");


player.addEventListener(
    "play",
    function() {

        disc.classList.add("playing");

        equalizer.classList.add("playing");

    }
);


player.addEventListener(
    "pause",
    function() {

        disc.classList.remove("playing");

        equalizer.classList.remove("playing");

    }
);


player.addEventListener(
    "ended",
    function() {

        disc.classList.remove("playing");

        equalizer.classList.remove("playing");

    }
);

</script>


</body>

</html>
