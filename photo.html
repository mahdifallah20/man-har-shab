<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>من هر شب | میثم ابراهیمی</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    min-height: 100%;
}

body {
    min-height: 100vh;

    font-family:
        Tahoma,
        Arial,
        sans-serif;

    color: white;

    display: flex;
    justify-content: center;
    align-items: center;

    padding: 20px;

    position: relative;

    background: #24322f;

    overflow-x: hidden;
}


/* پس زمینه محو از همان عکس */
.background {
    position: fixed;

    top: 0;
    left: 0;

    width: 100%;
    height: 100%;

    background-image:
        linear-gradient(
            rgba(0,0,0,0.20),
            rgba(0,0,0,0.30)
        ),
        url("music-page-background.jpg");

    background-size: cover;
    background-position: center;

    filter: blur(20px);

    transform: scale(1.08);

    z-index: 0;
}


/* خود عکس اصلی */
.photo {
    position: fixed;

    top: 0;
    left: 0;

    width: 100%;
    height: 100%;

    background-image:
        linear-gradient(
            rgba(0,0,0,0.08),
            rgba(0,0,0,0.15)
        ),
        url("music-page-background.jpg");

    background-repeat: no-repeat;

    background-position: center;

    background-size: contain;

    z-index: 1;

    pointer-events: none;
}


/* پنل موزیک */

.card {

    position: relative;

    z-index: 5;

    width: min(430px, 94vw);

    padding: 28px 24px 24px;

    text-align: center;

    background:
        rgba(20,20,20,0.40);

    border:
        1px solid
        rgba(255,255,255,0.30);

    border-radius: 30px;

    backdrop-filter:
        blur(7px);

    -webkit-backdrop-filter:
        blur(7px);

    box-shadow:
        0 25px 70px
        rgba(0,0,0,0.45);
}


/* صفحه گردان */

.disc {

    width: 145px;
    height: 145px;

    margin:
        0 auto 20px;

    border-radius: 50%;

    background:
        radial-gradient(
            circle,
            #d5a84f 0 7%,
            #222 8% 13%,
            #111 14% 100%
        );

    border:
        5px solid
        rgba(255,255,255,0.25);

    box-shadow:
        0 15px 40px
        rgba(0,0,0,0.60);

    animation:
        rotate 9s linear infinite;

    animation-play-state:
        paused;
}


.disc.playing {

    animation-play-state:
        running;
}


@keyframes rotate {

    from {
        transform:
            rotate(0deg);
    }

    to {
        transform:
            rotate(360deg);
    }

}


/* عنوان */

.label {

    font-size: 14px;

    opacity: 0.80;

    margin-bottom: 7px;
}


h1 {

    margin: 0;

    font-size: 31px;

    text-shadow:
        0 3px 15px
        rgba(0,0,0,0.70);
}


.artist {

    margin-top: 9px;

    font-size: 18px;

    opacity: 0.90;
}


/* خط */

.line {

    width: 65px;

    height: 3px;

    margin:
        18px auto;

    border-radius: 10px;

    background:
        rgba(255,255,255,0.85);
}


/* اکولایزر */

.equalizer {

    height: 35px;

    display: flex;

    justify-content: center;

    align-items: center;

    gap: 5px;

    margin-bottom: 12px;
}


.equalizer span {

    width: 4px;

    height: 8px;

    border-radius: 5px;

    background: white;

    animation:
        equalizer
        0.65s
        ease-in-out
        infinite
        alternate;

    animation-play-state:
        paused;
}


.equalizer.playing span {

    animation-play-state:
        running;
}


.equalizer span:nth-child(2) {
    animation-delay: .1s;
}

.equalizer span:nth-child(3) {
    animation-delay: .2s;
}

.equalizer span:nth-child(4) {
    animation-delay: .3s;
}

.equalizer span:nth-child(5) {
    animation-delay: .2s;
}

.equalizer span:nth-child(6) {
    animation-delay: .1s;
}


@keyframes equalizer {

    from {
        height: 7px;
    }

    to {
        height: 31px;
    }

}


/* پلیر */

audio {

    width: 100%;

    height: 48px;
}


/* متن */

.message {

    margin-top: 15px;

    font-size: 13px;

    line-height: 2;

    opacity: 0.78;
}


.footer {

    margin-top: 15px;

    font-size: 12px;

    opacity: 0.55;
}


/* موبایل */

@media (max-width: 600px) {

    body {

        padding:
            12px;

    }

    .card {

        width: 94vw;

        padding:
            22px
            18px
            20px;

        border-radius:
            25px;

        background:
            rgba(15,15,15,0.36);
    }

    .disc {

        width: 120px;
        height: 120px;

    }

    h1 {

        font-size: 27px;

    }

    .artist {

        font-size: 16px;

    }

}


/* موبایل عمودی:
   عکس اصلی تا حد ممکن کامل دیده شود */

@media (
    max-width: 600px
) and (
    orientation: portrait
) {

    .photo {

        background-size:
            contain;

        background-position:
            center center;

    }

}

</style>

</head>


<body>


<!-- پس زمینه محو -->

<div class="background"></div>


<!-- عکس اصلی -->

<div class="photo"></div>


<!-- پنل آهنگ -->

<div class="card">


    <div
        class="disc"
        id="disc">
    </div>


    <div class="label">

        🎵 آهنگ

    </div>


    <h1>

        من هر شب

    </h1>


    <div class="artist">

        میثم ابراهیمی

    </div>


    <div class="line"></div>


    <div
        class="equalizer"
        id="equalizer">

        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>

    </div>


    <audio
        id="player"
        controls
        preload="metadata">

        <source
            src="https://dl.rozmusic.com/Music/1404/02/27/Meysam%20Ebrahimi%20-%20Man%20Har%20Shab.mp3"
            type="audio/mpeg">

        مرورگر شما از پخش صوت پشتیبانی نمی‌کند.

    </audio>


    <div class="message">

        برای شنیدن آهنگ،
        دکمه ▶️ را فشار دهید.

    </div>


    <div class="footer">

        🎶 با عشق برای یک خاطره زیبا

    </div>


</div>


<script>

const player =
    document.getElementById("player");

const disc =
    document.getElementById("disc");

const equalizer =
    document.getElementById("equalizer");


player.addEventListener(
    "play",
    function() {

        disc.classList.add("playing");

        equalizer.classList.add("playing");

    }
);


player.addEventListener(
    "pause",
    function() {

        disc.classList.remove("playing");

        equalizer.classList.remove("playing");

    }
);


player.addEventListener(
    "ended",
    function() {

        disc.classList.remove("playing");

        equalizer.classList.remove("playing");

    }
);

</script>


</body>

</html>
